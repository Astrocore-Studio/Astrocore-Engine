[workspace]
resolver = "3"
members = [
    "crates/astrocore-core",
    "crates/astrocore-data",
    "crates/astrocore-math",
    "crates/astrocore-ecs",
    "crates/astrocore-prototypes",
    "crates/astrocore-map",
    "crates/astrocore-transport",
    "crates/astrocore-grid2d",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"

[workspace.dependencies]
astrocore-core = { path = "crates/astrocore-core" }
astrocore-data = { path = "crates/astrocore-data" }
astrocore-math = { path = "crates/astrocore-math" }
astrocore-ecs = { path = "crates/astrocore-ecs" }
astrocore-prototypes = { path = "crates/astrocore-prototypes" }
astrocore-map = { path = "crates/astrocore-map" }
astrocore-transport = { path = "crates/astrocore-transport" }
astrocore-grid2d = { path = "crates/astrocore-grid2d" }
bevy = { version = "=0.20.1", default-features = false }
bevy_ecs = { version = "=0.20.1", default-features = false, features = ["std", "multi_threaded", "async_executor"] }
bevy_tasks = { version = "=0.20.1", default-features = false, features = ["multi_threaded", "async_executor"] }
smallvec = "1"
glam = { version = "0.33", features = ["serde"] }
rayon = "1.11"
tempfile = "3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
postcard = { version = "1", features = ["use-std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
