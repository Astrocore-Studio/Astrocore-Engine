[workspace]
resolver = "3"
members = [
    "crates/astrocore-core",
    "crates/astrocore-transport",
    "crates/astrocore-grid2d",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"

[workspace.dependencies]
astrocore-core = { path = "crates/astrocore-core" }
astrocore-transport = { path = "crates/astrocore-transport" }
astrocore-grid2d = { path = "crates/astrocore-grid2d" }
bevy = { version = "=0.20.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
postcard = { version = "1", features = ["use-std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
