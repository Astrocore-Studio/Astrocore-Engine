name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt · clippy · test · границы зависимостей
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Headless-сервер без GPU и запрещённые связи крейтов
        run: ./scripts/check-headless.sh

      - name: Сервер запускается без окна и GPU (дымовой тест)
        run: |
          cargo build -p astrocore-server
          ./target/debug/astrocore-server --data-dir "$RUNNER_TEMP/astrocore-smoke" --ticks 20
